<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#dff3ff,#f7fbff 55%,#eef5ff);color:#17324d}
  .wrap{max-width:900px;margin:auto;padding:24px 16px 40px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  h1{margin:0;font-size:28px}
  .sub{color:#60758a;font-size:14px;margin-top:4px}
  select,button{border:0;border-radius:12px;padding:11px 14px;font-size:15px}
  select{background:white;box-shadow:0 2px 10px #00000012}
  button{background:#1769aa;color:white;cursor:pointer}
  .hero{background:white;border-radius:24px;padding:24px;box-shadow:0 8px 30px #295a7a18;display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
  .place{font-size:18px;font-weight:700}
  .weather-icon{font-size:64px;margin:8px 0}
  .temp{font-size:64px;font-weight:800;line-height:1}
  .condition{font-size:20px;margin-top:8px}
  .updated{color:#73869a;font-size:13px;margin-top:10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
  .stat{background:#f4f8fc;border-radius:16px;padding:15px}
  .stat b{display:block;font-size:21px;margin-top:5px}
  .section{margin-top:20px}
  .section h2{font-size:19px;margin:0 0 12px}
  .forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .day{background:white;border-radius:18px;padding:15px;text-align:center;box-shadow:0 5px 18px #295a7a10}
  .day .date{font-weight:700}
  .day .icon{font-size:30px;margin:9px 0}
  .day .high{font-weight:800}
  .day .low{color:#71869a;margin-top:3px}
  .hourly{background:white;border-radius:18px;padding:10px;overflow:auto;display:flex;gap:8px;box-shadow:0 5px 18px #295a7a10}
  .hour{min-width:82px;text-align:center;padding:10px 5px;border-right:1px solid #edf1f5}
  .hour:last-child{border:0}
  .note{margin-top:18px;color:#6c7f91;font-size:12px;line-height:1.6}
  .error{background:#fff0f0;color:#a33;border-radius:14px;padding:14px;margin-top:15px;display:none}
  @media(max-width:650px){.hero{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(5,150px);overflow:auto}.stats{grid-template-columns:1fr 1fr} header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🌤️ 우리 동네 날씨</h1>
      <div class="sub">실시간으로 업데이트되는 날씨 정보</div>
    </div>
    <div>
      <select id="location"></select>
      <button id="refresh">↻ 새로고침</button>
    </div>
  </header>

  <div id="error" class="error"></div>

  <section class="hero">
    <div>
      <div class="place" id="place">가평</div>
      <div class="weather-icon" id="icon">🌤️</div>
      <div class="temp"><span id="temp">--</span>°</div>
      <div class="condition" id="condition">불러오는 중...</div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="stats">
      <div class="stat">💧 습도<b id="humidity">--%</b></div>
      <div class="stat">💨 바람<b id="wind">-- km/h</b></div>
      <div class="stat">🌧️ 강수확률<b id="rain">--%</b></div>
      <div class="stat">🌡️ 체감온도<b id="feels">--°</b></div>
    </div>
  </section>

  <section class="section">
    <h2>📅 5일 예보</h2>
    <div class="forecast" id="forecast"></div>
  </section>

  <section class="section">
    <h2>🕐 시간대별 예보</h2>
    <div class="hourly" id="hourly"></div>
  </section>

  <div class="note">
    날씨 자료는 Open-Meteo API를 이용합니다. 이 앱은 교육·개인용 예제로 제작되었습니다.
  </div>
</div>

<script>
const places = {
  "가평": {lat:37.831, lon:127.510},
  "서울": {lat:37.5665, lon:126.9780},
  "춘천": {lat:37.8813, lon:127.7298},
  "인천": {lat:37.4563, lon:126.7052},
  "수원": {lat:37.2636, lon:127.0286},
  "대전": {lat:36.3504, lon:127.3845},
  "대구": {lat:35.8714, lon:128.6014},
  "부산": {lat:35.1796, lon:129.0756},
  "광주": {lat:35.1595, lon:126.8526}
};

const codes = {
  0:["☀️","맑음"],1:["🌤️","대체로 맑음"],2:["⛅","부분적으로 흐림"],3:["☁️","흐림"],
  45:["🌫️","안개"],48:["🌫️","안개"],51:["🌦️","이슬비"],53:["🌦️","이슬비"],55:["🌧️","강한 이슬비"],
  61:["🌦️","약한 비"],63:["🌧️","비"],65:["🌧️","강한 비"],71:["🌨️","약한 눈"],73:["🌨️","눈"],75:["❄️","강한 눈"],
  80:["🌦️","소나기"],81:["🌧️","소나기"],82:["⛈️","강한 소나기"],95:["⛈️","뇌우"],96:["⛈️","우박 동반 뇌우"],99:["⛈️","강한 뇌우"]
};

const loc = document.getElementById("location");
Object.keys(places).forEach(p => loc.add(new Option(p,p)));

function weatherText(code){ return codes[code] || ["🌡️","날씨 정보"]; }
function fmtDate(s){ const d=new Date(s+"T12:00:00"); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtHour(s){ return new Date(s).getHours()+"시"; }

async function loadWeather(){
  const name=loc.value, p=places[name];
  document.getElementById("place").textContent=name;
  document.getElementById("error").style.display="none";
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=5`;
    const res=await fetch(url);
    if(!res.ok) throw new Error("날씨 서버에서 자료를 받지 못했습니다.");
    const d=await res.json();

    const c=d.current, wt=weatherText(c.weather_code);
    document.getElementById("icon").textContent=wt[0];
    document.getElementById("temp").textContent=Math.round(c.temperature_2m);
    document.getElementById("condition").textContent=wt[1];
    document.getElementById("humidity").textContent=Math.round(c.relative_humidity_2m)+"%";
    document.getElementById("wind").textContent=Math.round(c.wind_speed_10m)+" km/h";
    document.getElementById("feels").textContent=Math.round(c.apparent_temperature)+"°";
    document.getElementById("rain").textContent=(d.daily.precipitation_probability_max[0] ?? 0)+"%";
    document.getElementById("updated").textContent="업데이트: "+new Date().toLocaleString("ko-KR");

    const f=document.getElementById("forecast"); f.innerHTML="";
    d.daily.time.forEach((date,i)=>{
      const [ico,txt]=weatherText(d.daily.weather_code[i]);
      f.innerHTML+=`<div class="day"><div class="date">${i===0?"오늘":fmtDate(date)}</div><div class="icon">${ico}</div><div>${txt}</div><div class="high">${Math.round(d.daily.temperature_2m_max[i])}°</div><div class="low">${Math.round(d.daily.temperature_2m_min[i])}°</div><div>🌧️ ${d.daily.precipitation_probability_max[i]??0}%</div></div>`;
    });

    const h=document.getElementById("hourly"); h.innerHTML="";
    const nowIndex=d.hourly.time.findIndex(x=>x>=c.time);
    for(let i=Math.max(0,nowIndex);i<Math.min(d.hourly.time.length,nowIndex+12);i++){
      const [ico]=weatherText(d.hourly.weather_code[i]);
      h.innerHTML+=`<div class="hour"><div>${fmtHour(d.hourly.time[i])}</div><div class="icon">${ico}</div><b>${Math.round(d.hourly.temperature_2m[i])}°</b><div>🌧️ ${d.hourly.precipitation_probability[i]??0}%</div></div>`;
    }
  }catch(e){
    const er=document.getElementById("error"); er.textContent="날씨 정보를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요."; er.style.display="block";
  }
}
loc.value="가평";
loc.addEventListener("change",loadWeather);
document.getElementById("refresh").addEventListener("click",loadWeather);
loadWeather();
</script>
</body>
</html>
